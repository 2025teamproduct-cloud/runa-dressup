<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Dress Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <div class="app">


    <!-- ジャンル -->
    <div class="genres">
      <div class="genre active">ワンピース</div>
      <div class="genre">トップス</div>
      <div class="genre">ボトムス</div>
      <div class="genre">シューズ</div>
      <div class="genre">髪型</div>
      <div class="genre">目</div>
      <div class="genre">その他</div>
    </div>

    <!-- パレット -->
    <div class="palette">

      <!-- ★ パレット上部：画像ボタン（上に4枚） -->
      <div class="palette-header">
        <img
          src="img/scroll-up.png"
          id="paletteScrollUpBtn"
          class="prev-row-btn"
          alt=""
        >
      </div>

      <!-- アイテム表示グリッド -->
      <div class="grid" id="itemGrid"></div>

      <!-- パレット下部：画像ボタン（下に4枚） -->
      <div class="palette-footer">
        <img
          src="img/scroll-down.png"
          id="paletteScrollBtn"
          class="next-row-btn"
          alt=""
        >
      </div>

    </div>

    <!-- 結果 -->
    <div class="result">
      <div class="result-canvas" id="resultCanvas">

        <!-- Undo ボタン -->
        <img
          src="img/undo.png"
          id="undoBtn"
          class="undo-btn"
          alt=""
        >

      </div>
    </div>

        <!-- 背景切り替え -->
    <button id="bgReload" class="reload-btn">↻</button>


  </div>
</div>

<script src="script.js"></script>
</body>
</html>
