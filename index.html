<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dress Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <div class="app">

    <!-- 背景切り替えボタン -->
    <button id="bgReload" class="reload-btn">↻</button>

    <!-- ジャンル -->
    <div class="genres">
      <div class="genre active">ワンピース</div>
      <div class="genre">トップス</div>
      <div class="genre">ボトムス</div>
      <div class="genre">インナー</div>
      <div class="genre">シューズ</div>
      <div class="genre">髪型</div>
    </div>

    <!-- パレット -->
    <div class="palette">
      <button id="loadFolder" class="load-btn">＋</button>
      <div class="grid" id="itemGrid"></div>
    </div>

    <!-- リザルト -->
    <div class="result">
      <div class="result-canvas" id="resultCanvas">
        <!-- 着せ替えレイヤーはここに追加 -->
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
