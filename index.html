<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Dress Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <div class="app">

    <!-- 背景切り替え -->
    <button id="bgReload" class="reload-btn">↻</button>

    <!-- ジャンル -->
    <div class="genres">
      <div class="genre active">ワンピース</div>
      <div class="genre">トップス</div>
      <div class="genre">ボトムス</div>
      <div class="genre">シューズ</div>
      <div class="genre">髪型</div>
      <div class="genre">目</div>
      <div class="genre">その他</div>
    </div>

    <!-- パレット -->
    <div class="palette">
      <!-- アイテム表示グリッド -->
      <div class="grid" id="itemGrid"></div>

      <!-- 下部装飾＋スクロールボタン -->
      <div class="palette-footer">
        <!-- 装飾ベース -->
        <img src="img/palette_base.png" class="palette-base" alt="">

        <!-- 1列送りボタン -->
        <img
          src="img/scroll-down.png"
          id="paletteScrollBtn"
          class="next-row-btn"
          alt=""
        >
      </div>
    </div>

    <!-- 結果 -->
    <div class="result">
      <div class="result-canvas" id="resultCanvas"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
